title = "Setu gitleaks config"
[extend]
useDefault = true
[allowlist]
description = "DEV-ONLY placeholder secrets that ship in config defaults / .env.example / docs, and SYNTHETIC TOTP secrets in demo personas"
paths = [
  '''backend/app/config\.py''',
  '''\.env\.example''',
  '''data/personas\.json''',
  '''data/generate_data\.py''',
  '''docs/.*''',
  '''evidence/.*''',
  '''docker-compose\.yml''',
  '''backend/tests/.*''',
  '''backend/eval/.*''',
]
