title = "Setu gitleaks config"
[extend]
useDefault = true
[allowlist]
description = "DEV-ONLY placeholder secrets that ship in config defaults / .env.example / docs, and SYNTHETIC TOTP secrets in demo personas"
paths = [
  '''server/src/config\.ts''',
  '''\.env\.example''',
  '''data/personas\.json''',
  '''server/scripts/generate_data\.ts''',
  '''docs/.*''',
  '''evidence/.*''',
  '''docker-compose\.yml''',
  '''server/tests/.*''',
  '''server/eval/.*''',
]
