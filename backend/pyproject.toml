[project]
name = "setu-backend"
version = "0.1.0"
description = "Setu 桥 - guarded cross-border finance agent (SYNTHETIC DATA, hackathon demo)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "pyotp>=2.9",
  "argon2-cffi>=23.1",
  "cryptography>=43",
  "structlog>=24.4",
  "pyjwt>=2.9",
  "python-multipart>=0.0.9",
  "pypdf>=5.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "hypothesis>=6.110",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-pyyaml",
  "reportlab>=4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
