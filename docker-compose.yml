# Offline demo: `docker compose up --build` -> web :3000, api :8000. No keys needed. SYNTHETIC DATA.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ALLOW_OFFLINE: "true"
      LLM_PROVIDER: scripted
      DATABASE_URL: sqlite:////var/lib/setu/setu.db
      CORS_ORIGINS: http://localhost:3000
      DEMO_MODE: "true"
      FX_MODE: fixture
    volumes:
      - setu-db:/var/lib/setu
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  web:
    build:
      context: ./web
      args:
        # inlined at build time: the BROWSER calls the API directly on the host's port 8000
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_MOCK: "false"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
volumes:
  setu-db:
